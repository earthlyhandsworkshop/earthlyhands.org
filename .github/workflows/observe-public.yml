name: Observe public deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Allow static host to catch up
        run: |
          for attempt in 1 2 3 4 5 6; do
            node scripts/observe-public.mjs && exit 0
            sleep 20
          done
          node scripts/observe-public.mjs

      - name: Install Chromium for visual witness
        if: always()
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture public front edge
        if: always()
        run: |
          mkdir -p public-observation
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page https://earthlyhands.org public-observation/front-edge.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page https://earthlyhands.org/mcr879.html public-observation/mcr879.png

      - name: Upload public observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-observation-${{ github.sha }}
          path: public-observation/
          if-no-files-found: error
          retention-days: 30
