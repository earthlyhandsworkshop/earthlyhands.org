name: Observe public deployment

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Allow static host to catch up
        run: |
          for attempt in 1 2 3 4 5 6; do
            node scripts/observe-public.mjs && exit 0
            sleep 20
          done
          node scripts/observe-public.mjs

      - name: Install Chromium for visual witness
        if: always()
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Verify Follow One Proposition interaction
        if: always()
        run: |
          npx --yes -p playwright@1.55.0 node - <<'NODE'
          (async () => {
            const { chromium } = require("playwright");
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            await page.goto("https://earthlyhands.org/experiments/one-proposition-many-carriers/", {waitUntil:"networkidle"});
            const before = await page.locator("#carrier-position").textContent();
            await page.locator("#next").click();
            const after = await page.locator("#carrier-position").textContent();
            const statement = await page.locator("#statement").textContent();
            if (!before?.includes("01") || !after?.includes("02") || !statement?.includes("did comply")) {
              throw new Error(`Follow One Proposition did not advance correctly: before=${before} after=${after} statement=${statement}`);
            }
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Capture public ground
        if: always()
        run: |
          mkdir -p public-observation
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1280,1000" https://earthlyhands.org public-observation/front-edge-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" https://earthlyhands.org public-observation/front-edge-mobile.png

          # Dawson visual witness: capture the actual viewport at each state, not only the default front edge.
          for state in report night morning southeast blue-water dozen; do
            npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1280,900" "https://earthlyhands.org/#$state" "public-observation/dawson-$state-desktop.png"
          done
          for state in night morning southeast blue-water; do
            npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" "https://earthlyhands.org/#$state" "public-observation/dawson-$state-mobile.png"
          done

          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="1280,900" https://earthlyhands.org public-observation/front-edge-full-page.png

          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="1280,900" https://earthlyhands.org/mcr879.html public-observation/mcr879-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="390,844" https://earthlyhands.org/mcr879.html public-observation/mcr879-mobile.png

          for page in follow-the-carrier shared-country article-xiv-identity-gate which-robert what-crossed one-proposition-many-carriers dancing-rabbit-statehood-line register-line-front-edge four-way-room-nav dawson-inline-depth ward-room one-outing-two-clocks register-threshold-v2 listening-threshold; do
            npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="1280,900" "https://earthlyhands.org/experiments/$page/" "public-observation/$page-desktop.png"
            npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="390,844" "https://earthlyhands.org/experiments/$page/" "public-observation/$page-mobile.png"
          done

          # Needle Up state-change witness: capture later carrier states as distinct public addresses.
          for carrier in 2 4; do
            npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="1280,900" "https://earthlyhands.org/experiments/one-proposition-many-carriers/?carrier=$carrier" "public-observation/one-proposition-many-carriers-carrier-$carrier-desktop.png"
            npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="390,844" "https://earthlyhands.org/experiments/one-proposition-many-carriers/?carrier=$carrier" "public-observation/one-proposition-many-carriers-carrier-$carrier-mobile.png"
          done

      - name: Capture every public HTML page
        if: always()
        run: |
          mkdir -p public-observation/site-desktop public-observation/site-mobile

          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const skipRoots = new Set([".git", ".github", "node_modules", "public-observation"]);
          const pages = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              if (entry.isDirectory() && skipRoots.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith(".html")) pages.push(full.replace(/^\.\//, ""));
            }
          }
          walk(".");

          const rows = pages.sort().map(file => {
            let urlPath;
            if (file === "index.html") urlPath = "/";
            else if (file.endsWith("/index.html")) urlPath = "/" + file.slice(0, -10);
            else urlPath = "/" + file;

            const slug = file
              .replace(/\/index\.html$/, "")
              .replace(/\.html$/, "")
              .replace(/^index$/, "front-door")
              .replace(/[^a-zA-Z0-9._-]+/g, "--");

            return {file, url: "https://earthlyhands.org" + urlPath, slug};
          });

          fs.writeFileSync("public-observation/site-pages.json", JSON.stringify({
            generated_at: new Date().toISOString(),
            count: rows.length,
            pages: rows
          }, null, 2));

          fs.writeFileSync("/tmp/site-pages.tsv", rows.map(r => [r.slug, r.url].join("\t")).join("\n") + "\n");
          console.log("Public HTML pages discovered:", rows.length);
          NODE

          failures=0
          while IFS=        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-observation-${{ github.sha }}
          path: public-observation/
          if-no-files-found: error
          retention-days: 30
\t' read -r slug url; do
            [ -z "$slug" ] && continue
            echo "Witnessing $url"
            if ! npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="1280,900" "$url" "public-observation/site-desktop/$slug.png"; then
              echo "DESKTOP FAIL $url" >> public-observation/site-capture-failures.txt
              failures=$((failures+1))
            fi
            if ! npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="390,844" "$url" "public-observation/site-mobile/$slug.png"; then
              echo "MOBILE FAIL $url" >> public-observation/site-capture-failures.txt
              failures=$((failures+1))
            fi
          done < /tmp/site-pages.tsv

          echo "$failures" > public-observation/site-capture-failure-count.txt

      - name: Upload public observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-observation-${{ github.sha }}
          path: public-observation/
          if-no-files-found: error
          retention-days: 30
