name: Import Mullion line specimen

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-mullion-specimen.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the preserved specimen image
        run: |
          mkdir -p experiments/dancing-rabbit-statehood-line
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXf9zbWPWksyXK2EWFzicDJO-Mi2m3FRC3HoD7wGr3xfJkwUyWI_SX1UaczBVfXFnlr-xU47_HyP62Hg59l09vgS-2jiAI3jKamzzzalEVpncAEZJGIoUOhOjluneAZtvhNYXWSm3_nqGFmePuYGgFQc0O-m5a-Z6kYYWsxPkHvGOwoOMyI=s2048?key=jed5wGPDYOm017mvztaO3g' -o experiments/dancing-rabbit-statehood-line/mullion-specimen
          mime="$(file -b --mime-type experiments/dancing-rabbit-statehood-line/mullion-specimen)"
          case "$mime" in
            image/png) ext=png ;;
            image/jpeg) ext=jpg ;;
            image/webp) ext=webp ;;
            *) echo "Unexpected MIME type: $mime"; exit 1 ;;
          esac
          mv experiments/dancing-rabbit-statehood-line/mullion-specimen "experiments/dancing-rabbit-statehood-line/mullion-specimen.$ext"
          echo "SPECIMEN_PATH=experiments/dancing-rabbit-statehood-line/mullion-specimen.$ext" >> "$GITHUB_ENV"

      - name: Commit the website asset
        run: |
          git config user.name "earthlyhandsworkshop"
          git config user.email "workshop@earthlyhands.org"
          git add "$SPECIMEN_PATH"
          git commit -m "Preserve Mullion line specimen for public ground"
          git push
