# Isolated verification for fictional One Workshop experiments only.
# Does not build, publish, deploy, or read historical Google Drive holdings.
name: One Workshop draft tests

on:
  push:
    branches:
      - experiment/one-workshop-foundation-2026-10-14
    paths:
      - "experiments/one-workshop/**"
      - ".github/workflows/one-workshop-draft-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 fictional-model regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated experimental tests
        run: node --test experiments/one-workshop/*.test.mjs
