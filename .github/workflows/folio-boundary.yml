name: Folio boundary tests

on:
  push:
    branches:
      - fieldglass/folio-fail-closed-boundary-v1
  pull_request:
    paths:
      - "worker/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
